services:
  init:
    build: .
    command: ["python", "bootstrap.py"]
    environment:
      COLLECTOR_DATA: /data
      COLLECTOR_ADMIN_NAME: ${COLLECTOR_ADMIN_NAME:-administrador}
      COLLECTOR_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_password
    volumes: ["collector_data:/data"]
    secrets: [bootstrap_password]
  api:
    build: .
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      COLLECTOR_DATA: /data
      COLLECTOR_EMBEDDED_WORKER: "0"
    depends_on:
      init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["collector_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_app/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      COLLECTOR_DATA: /data
    depends_on:
      init:
        condition: service_completed_successfully
    volumes: ["collector_data:/data"]
    restart: unless-stopped
volumes:
  collector_data:
secrets:
  bootstrap_password:
    file: ./secrets/bootstrap_password.txt
