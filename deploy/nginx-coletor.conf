# Reverse proxy para o Coletor IPHAN.
# Copiar para /etc/nginx/sites-available/coletor.sigpa.com.br e ativar com symlink.
# O certbot --nginx adiciona o bloco 443/SSL automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name coletor.sigpa.com.br;

    # Desafio ACME do Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # App aceita arquivos de até 128 MiB; folga no proxy.
        client_max_body_size 160M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }
}
